[project]
name = "tyvo"
revision = "1.0"

[profiles.default]
# The signing key itself, not just its passwords. Stored base64 so it survives
# text-only providers, and `as_path` writes it to a temp file at build time so
# Gradle gets a path without the .jks ever sitting in the working tree.
TYVO_KEYSTORE_PATH = { description = "Release upload keystore (.jks)", required = true, encoding = "base64", as_path = true }
TYVO_KEYSTORE_PASSWORD = { description = "Password for the keystore file", required = true }
# Not required: it has a sensible default, and SecretSpec rejects a
# declaration that is both required and defaulted.
TYVO_KEY_ALIAS = { description = "Signing key alias inside the keystore", required = false, default = "tyvo" }
TYVO_KEY_PASSWORD = { description = "Password for the signing key", required = true }

# Only for the clean-up eval in research/: `secretspec run -P research -- ...`.
# A separate profile so release builds never ask for it.
[profiles.research]
MISTRAL_API_KEY = { description = "Mistral API key for the clean-up eval in research/", required = true }
